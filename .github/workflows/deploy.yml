# Cloudflare Workers 自动部署：push main / 手动触发 / 每日定时（定时构建兜底主仓 docs 与
# Releases 的变更——全站内容都是构建期拉取，见 docs/ARCHITECTURE.md）。
# 也可以不用本文件，本机 `npx wrangler deploy` 直接发（见 README）。
name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch: {} # 主仓 release.sh 发版后用 gh workflow run 触发，站点 1-2 分钟内跟上
  schedule:
    - cron: '0 1 * * *' # 每天 09:00（UTC+8）；注意：仓库 60 天无活动 GitHub 会自动停用 schedule

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # GITHUB_TOKEN 由 Actions 自动注入：构建期拉 GitHub Releases 认证后不限流（releases.ts 消费）
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
